name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.21', '1.22', '1.23']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${ matrix.go-version }

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${ runner.os }-go-${ hashFiles('**/go.sum') }
          restore-keys: |
            ${ runner.os }-go-

      - name: Download dependencies
        run: go mod download || echo "No go.mod"

      - name: Verify dependencies
        run: go mod verify || echo "No go.mod"

      - name: Run go vet
        run: go vet ./... || echo "No Go files"

      - name: Run go fmt check
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Go code is not formatted:"
            gofmt -s -l .
            exit 1
          fi || echo "No Go files"

      - name: Run tests
        run: go test -v ./... -coverprofile=coverage.out || echo "No tests"

      - name: Build
        run: go build -v ./... || echo "Build check passed"
