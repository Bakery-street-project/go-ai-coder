# BAKERSTREET-LABS-2025 — Bakerstreet Labs
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - name: Build working tools
        run: |
          go build ./cmd/chat/...
          go build ./cmd/github_ai_agent/...
          go build ./cmd/read_simple/...
          go build ./cmd/cloud-ai/...
      - run: go vet ./internal/...
